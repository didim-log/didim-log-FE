# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm test
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # 빌드 전 캐시 및 이전 빌드 산출물 정리
      - name: Clean build artifacts and cache
        run: |
          echo "🧹 Cleaning build artifacts and cache..."
          rm -rf dist
          rm -rf node_modules/.vite
          echo "✅ Cleanup completed"

      # 빌드 시 환경 변수 주입 (중요!)
      # - 실제 API 주소는 레포에 하드코딩하지 않고 GitHub Secrets로만 관리합니다.
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # [검증 단계] 빌드 산출물에 localhost가 섞이지 않았는지 확인
      - name: Verify no localhost in build artifacts
        run: |
          echo "🔎 Checking build artifacts..."

          if [ -z "${{ secrets.VITE_API_URL }}" ]; then
            echo "❌ Error: VITE_API_URL secret is not set."
            exit 1
          fi

          if grep -r "localhost:8080" dist/ > /dev/null; then
            echo "❌ Error: Build artifacts contain localhost:8080."
            exit 1
          fi

          echo "✅ Success: No localhost:8080 found in build artifacts."
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIDIM_LOG_FE }}
          channelId: live
          projectId: didim-log-fe
